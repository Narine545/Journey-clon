name: Inspect supplied tower
on:
  push:
    branches: ["arena/4b8d381d-journey-clon"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load Blender model
        run: |
          trap 'echo "::error::failed near line $LINENO, exit $?"; for file in /tmp/blend-install.log /tmp/blend-inspection.log; do test ! -f "$file" || tail -20 "$file" | while IFS= read -r line; do echo "::error::$line"; done; done' ERR
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1
          python3 -m venv /tmp/blender-venv
          /tmp/blender-venv/bin/pip -q install bpy==5.0.1 > /tmp/blend-install.log 2>&1
          /tmp/blender-venv/bin/python tools/inspect_blend.py "$PWD/godot tower with lift.blend" > /tmp/blend-inspection.log 2>&1
          grep 'INSPECTION_JSON=' /tmp/blend-inspection.log | sed 's/^INSPECTION_JSON=//' | gzip -c | base64 -w0 | fold -w 3000 | awk '{printf "::notice::BLEND%02d_%s\n", NR, $0}'
