name: Temporary Springfield geometry analysis
on:
  push:
    branches: ["arena/4b8d381d-journey-clon"]
permissions:
  contents: write
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[spring-refine]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4b8d381d-journey-clon
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1
          python -m pip install 'bpy==4.5.15'
      - name: Inspect geometry
        run: |
          python - <<'PYCODE'
          import runpy, traceback, sys
          try:
              runpy.run_path('tools/export_nzp_game_rifle.py', run_name='__main__')
          except Exception:
              print('::error::' + traceback.format_exc().replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'), flush=True)
              sys.exit(1)
          PYCODE

      - name: Publish refined model on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/weapons/nzp_springfield.glb assets/weapons/nzp_springfield_framing.json
          git commit -m 'Export refined Springfield geometry'
          git push origin HEAD:refs/heads/arena/4b8d381d-journey-clon
