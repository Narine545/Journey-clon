name: validate
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Verify reproducible corrected tower
        run: |
          python3 tools/combine_tower_glb.py --output /tmp/tower_delivery.glb
          cmp /tmp/tower_delivery.glb assets/tower/tower_delivery.glb
      - name: Import
        run: |
          ./godot --headless --path . --import 2>&1 | tee import.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' import.log; then
            grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' import.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            ./godot --headless --path . --script res://scripts/smoke_test.gd --check-only 2>&1 | head -30 | while IFS= read -r line; do echo "::error::$line"; done || true
            exit 1
          fi
      - name: M5 smoke test
        run: |
          set +e
          JOURNEY_SMOKE=1 timeout 300 ./godot --headless --path . 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          grep -iE 'SMOKE.*(FAIL|итог)|SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' smoke.log | head -30 | while IFS= read -r line; do echo "::notice::$line"; done || true
          if [ "$code" -ne 0 ]; then echo "::error::Smoke exited with code $code"; exit 1; fi
          grep -q '\[SMOKE\] итог: ВСЁ ПРОШЛО' smoke.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' smoke.log; then exit 1; fi
      - name: Defeat and restart smoke test
        run: |
          set +e
          JOURNEY_RESTART_SMOKE=1 timeout 120 ./godot --headless --path . 2>&1 | tee restart.log
          code=${PIPESTATUS[0]}
          set -e
          grep -iE 'RESTART|SCRIPT ERROR|Parse Error|ERROR:' restart.log | head -20 | while IFS= read -r line; do echo "::notice::$line"; done || true
          if [ "$code" -ne 0 ]; then echo "::error::Restart smoke exited with code $code"; exit 1; fi
          grep -q '\[RESTART\] ВСЁ ПРОШЛО' restart.log
          if grep -iE 'SCRIPT ERROR|Parse Error|ERROR:' restart.log; then exit 1; fi
      - name: Forward+ Vulkan render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
          JOURNEY_SPRING_PATH="$PWD/spring_reload.png" JOURNEY_SHOT=1 JOURNEY_FRAME_PATH="$PWD/frame.png" JOURNEY_HOOK_PATH="$PWD/hook.png" JOURNEY_PISTOL_PATH="$PWD/pistol.png" JOURNEY_SCALE_PATH="$PWD/robot_scale.png" JOURNEY_ATTACK_PATH="$PWD/attack.png" JOURNEY_DEFEAT_PATH="$PWD/defeat.png" JOURNEY_DEBUG_PATH="$PWD/debug.png" JOURNEY_CLIMB_PATH="$PWD/climb.png" JOURNEY_LIFT_PATH="$PWD/lift.png" JOURNEY_SHOP_PATH="$PWD/shop.png" JOURNEY_CRATE_PATH="$PWD/crate.png" JOURNEY_SHOT_PATH="$PWD/tower.png" JOURNEY_LANDSCAPE_PATH="$PWD/landscape.png" JOURNEY_SCOPE_PATH="$PWD/scope.png" JOURNEY_RADIO_PATH="$PWD/radio.png" JOURNEY_ROBOT_PATH="$PWD/robot.png" JOURNEY_SKY_PATH="$PWD/sky.png" JOURNEY_RAIL_PATH="$PWD/rail.png" timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' ./godot --path . --audio-driver Dummy --rendering-method forward_plus --resolution 1280x720 2>&1 | tee render.log
          test -s tower.png
          test -s landscape.png
          test -s scope.png
          test -s radio.png
          test -s robot.png
          test -s sky.png
          test -s rail.png
          test -s shop.png
          test -s crate.png
          test -s lift.png
          test -s climb.png
          test -s debug.png
          test -s robot_scale.png
          test -s pistol.png
          test -s hook.png
          test -s frame.png
          test -s attack.png
          test -s defeat.png
          grep -q 'Vulkan.*Forward+' render.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' render.log; then
            grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' render.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Temporary Springfield visual review
        run: |
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -v error -y -i tower.png -vf scale=800:-2 -q:v 9 /tmp/spring-tower.jpg
          ffmpeg -v error -y -i spring_reload.png -vf scale=800:-2 -q:v 9 /tmp/spring-reload.jpg
          python3 - <<'PYCODE'
          import base64
          from pathlib import Path
          for tag in ['reload']:
              data=base64.b64encode(Path('/tmp/spring-'+tag+'.jpg').read_bytes()).decode()
              chunks=[data[i:i+3000] for i in range(0,len(data),3000)]
              print('::notice::SPRING_COUNT_'+tag+'_'+str(len(chunks)))
              for i,c in enumerate(chunks[:9]): print('::notice::SPRING_'+tag+'_'+str(i)+'_'+c)
          PYCODE
      - name: Temporary remaining review data
        run: |
          python3 - <<'PYCODE'
          import base64
          from pathlib import Path
          for tag in ['reload']:
              data=base64.b64encode(Path('/tmp/spring-'+tag+'.jpg').read_bytes()).decode()
              chunks=[data[i:i+3000] for i in range(0,len(data),3000)]
              for i in range(9,len(chunks)): print('::notice::SPRING_'+tag+'_'+str(i)+'_'+chunks[i])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-logs
          path: |
            *.log
            tower.png
            landscape.png
            scope.png
            radio.png
            robot.png
            sky.png
            rail.png
            shop.png
            crate.png
            lift.png
            climb.png
            debug.png
            robot_scale.png
            pistol.png
            hook.png
            frame.png
            attack.png
            defeat.png
