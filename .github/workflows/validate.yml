name: validate
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import
        run: |
          ./godot --headless --path . --import 2>&1 | tee import.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:' import.log; then exit 1; fi
      - name: M0 smoke test
        run: |
          JOURNEY_SMOKE=1 ./godot --headless --path . 2>&1 | tee smoke.log
          grep -q '\[SMOKE\] итог: ВСЁ ПРОШЛО' smoke.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:' smoke.log; then exit 1; fi
      - name: Forward+ Vulkan render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
          xvfb-run -a -s '-screen 0 1280x720x24' ./godot --path . --audio-driver Dummy --rendering-method forward_plus --resolution 1280x720 --quit-after 150 2>&1 | tee render.log
          grep -q 'Vulkan.*Forward+' render.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:' render.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-logs
          path: '*.log'
