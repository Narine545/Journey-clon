name: validate

# Проверки проекта Godot 4.7.2 (Linux): импорт, автотесты геймплея и рендер.
# Работа разделена на три параллельные задачи, потому что программный рендер
# (xvfb + Vulkan lavapipe) на общем раннере не успевает в один лимит времени:
#   headless — импорт и оба headless-автотеста;
#   ui       — витрина интерфейса TIDECUT (скриншоты всех экранов);
#   render   — шейдеры под настоящим Forward+ и кадры игровых сцен.
# Артефакты (логи и кадры) коммитятся в .ci-logs/ и shots/, у каждой задачи
# свои файлы, поэтому коммиты не конфликтуют.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot_bin
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot_bin
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin/godot
          chmod +x godot_bin/godot
          godot_bin/godot --version

      - name: Import project
        run: |
          godot_bin/godot --headless --path . --import > import.log 2>&1
          code=$?
          cat import.log
          if grep -qE "SCRIPT ERROR|Parse Error|Parse error|SHADER ERROR|Can't load|Failed to compile|Shader|SHADOWED_VARIABLE_BASE_CLASS|INTEGER_DIVISION" import.log; then
            echo "::error::Ошибки при импорте (см. .ci-logs в коммите CI)"
            grep -E "SCRIPT ERROR|Parse Error|Parse error|SHADER ERROR|Can't load|Failed to compile|Shader" import.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          if [ $code -ne 0 ]; then
            echo "::error::Импорт завершился с кодом $code"
            tail -10 import.log | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Smoke run (автотест геймплея)
        run: |
          JOURNEY_SMOKE=1 godot_bin/godot --headless --path . res://scenes/main.tscn --quit-after 12000 > smoke.log 2>&1
          code=$?
          cat smoke.log
          if ! grep -q "SMOKE] итог" smoke.log; then
            echo "::error::Smoke-тест не дошёл до конца (нет итоговой строки)"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Invalid (get|call|set)|Unable to" smoke.log; then
            echo "::error::Ошибки скриптов в рантайме (см. .ci-logs в коммите CI)"
            grep -E "SCRIPT ERROR|Invalid (get|call|set)|Unable to" smoke.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          if [ $code -ne 0 ]; then
            echo "::error::Smoke-тест завершился с кодом $code"
            grep "SMOKE" smoke.log | tail -30 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Boat prototype smoke test
        run: |
          JOURNEY_BOAT_SMOKE=1 godot_bin/godot --headless --path . --quit-after 500 > boat-smoke.log 2>&1
          cat boat-smoke.log
          grep -q '\[BOAT SMOKE\] итог: ВСЁ ПРОШЛО' boat-smoke.log
          if grep -qE 'SCRIPT ERROR|Parse Error|Invalid (get|call|set)|SHADOWED_VARIABLE_BASE_CLASS|INTEGER_DIVISION' boat-smoke.log; then
            exit 1
          fi

      - name: Publish logs (всегда)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p .ci-logs
          rm -f .ci-logs/import.log .ci-logs/smoke.log .ci-logs/boat-smoke.log
          cp -f import.log .ci-logs/ 2>/dev/null || echo "import: пропущен" > .ci-logs/import.log
          cp -f smoke.log .ci-logs/ 2>/dev/null || echo "smoke: пропущен" > .ci-logs/smoke.log
          cp -f boat-smoke.log .ci-logs/ 2>/dev/null || echo "boat-smoke: пропущен" > .ci-logs/boat-smoke.log
          git add .ci-logs
          git commit -m "ci: логи headless-прогона ${GITHUB_SHA::7} [skip ci]" || true
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "${GITHUB_REF#refs/heads/}" || true
            if git push origin HEAD:"${GITHUB_REF#refs/heads/}"; then
              break
            fi
            sleep 5
          done

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot_bin
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot_bin
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin/godot
          chmod +x godot_bin/godot
          godot_bin/godot --version

      - name: Vulkan (lavapipe) для витрины
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools > /dev/null
          vulkaninfo --summary 2>/dev/null | grep -A2 "GPU0" || echo "lavapipe: инфо недоступна"

      - name: Import project
        run: |
          godot_bin/godot --headless --path . --import > import-ui.log 2>&1
          tail -20 import-ui.log

      # Витрина интерфейса TIDECUT: все экраны снимаются отдельным скриптом
      # и кладутся в shots/ — по ним видно, как выглядит редизайн на самом деле.
      - name: TIDECUT UI screenshots (витрина интерфейса)
        run: |
          mkdir -p shots
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::error::xvfb-run недоступен — витрину интерфейса не снять"
            exit 1
          fi
          TIDE_SHOT_DIR="$PWD/shots" TIDE_SHOWCASE_QUIT=1 \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            godot_bin/godot --path . res://scenes/ui/showcase.tscn \
            --rendering-method forward_plus --resolution 1920x1080 \
            --fixed-fps 30 --quit-after 3000 > tide-ui.log 2>&1 || true
          cat tide-ui.log
          ls -la shots || true
          if grep -qiE "SCRIPT ERROR|SHADER ERROR|failed to compile|error compiling|Parse Error" tide-ui.log; then
            echo "::error::Ошибка в UI-витрине TIDECUT (см. tide-ui.log)"
            grep -iE "SCRIPT ERROR|SHADER ERROR|failed to compile|error compiling|Parse Error" tide-ui.log | head -12 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          test -f shots/tide_01_upgrade.png || (echo "::error::Скриншоты витрины не сохранились" && exit 1)
          if [ "$(ls -1 shots/*.png | wc -l)" -lt 6 ]; then
            echo "::error::Снято меньше шести экранов витрины"
            exit 1
          fi

      - name: Publish UI shots (всегда)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p .ci-logs
          cp -f tide-ui.log .ci-logs/ 2>/dev/null || echo "витрина: пропущена" > .ci-logs/tide-ui.log
          git add .ci-logs/tide-ui.log
          if compgen -G "shots/*.png" > /dev/null; then
            git add shots
          fi
          git commit -m "ci: кадры витрины TIDECUT ${GITHUB_SHA::7} [skip ci]" || true
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "${GITHUB_REF#refs/heads/}" || true
            if git push origin HEAD:"${GITHUB_REF#refs/heads/}"; then
              break
            fi
            sleep 5
          done

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot_bin
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot_bin
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin/godot
          chmod +x godot_bin/godot
          godot_bin/godot --version

      - name: Vulkan (lavapipe) для рендер-проверки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools > /dev/null
          vulkaninfo --summary 2>/dev/null | grep -A2 "GPU0" || echo "lavapipe: инфо недоступна"

      - name: Import project
        run: |
          godot_bin/godot --headless --path . --import > import-render.log 2>&1
          tail -20 import-render.log

      # Headless (dummy-рендерер) НЕ компилирует шейдеры. Прогоняем несколько
      # кадров под xvfb + Vulkan lavapipe (софтверный) с настоящим Forward+ —
      # поймаем ошибки шейдеров и снимем кадры (проект на forward_plus).
      - name: Render check (шейдеры + скриншоты, xvfb + Vulkan lavapipe)
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::warning::xvfb-run недоступен — рендер-проверка пропущена"
            exit 0
          fi
          JOURNEY_BOAT_SHOT=1 JOURNEY_BOAT_SHOT_DRIVE=1 JOURNEY_BOAT_SHOT_TRAILER=1 JOURNEY_BOAT_SHOT_PATH="$PWD/boat.png" \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . --rendering-method forward_plus \
            --resolution 1280x720 --fixed-fps 30 --quit-after 150 \
            > boat-render.log 2>&1
          cat boat-render.log
          test -s boat.png
          if grep -iE "SHADER ERROR|failed to compile|error compiling|SCRIPT ERROR" boat-render.log; then
            exit 1
          fi
          mkdir -p .ci-logs/shots
          rm -f .ci-logs/shots/*.png # чистим кадры прошлого прогона
          SHOT_DIR="$PWD/.ci-logs/shots" JOURNEY_SHOT=1 \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . res://scenes/main.tscn --rendering-method forward_plus \
            --resolution 1280x720 --fixed-fps 30 --quit-after 700 \
            > render.log 2>&1 || true
          cat render.log
          ls -la .ci-logs/shots || true
          if grep -iE "SHADER ERROR|failed to compile|error compiling" render.log; then
            echo "::error::Ошибки компиляции шейдеров"
            exit 1
          fi
          if grep -qiE "do not support any of the supported Vulkan|Could not create.*Vulkan|Your video card" render.log; then
            echo "::error::Vulkan-контекст не поднялся (lavapipe?)"
            exit 1
          fi
          if grep -q "Vulkan" render.log; then
            echo "Vulkan-рендер поднялся, шейдеры скомпилированы"
          else
            echo "::warning::Vulkan-контекст не найден в логе — проверка могла не состояться"
          fi
          if [ ! -f .ci-logs/shots/shot_a_coast.png ]; then
            echo "::error::Скриншоты не сохранились — что-то не так с рендером"
            exit 1
          fi

      - name: Publish render artifacts (всегда)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p .ci-logs/shots
          rm -f .ci-logs/render.log .ci-logs/boat-render.log
          cp -f render.log .ci-logs/ 2>/dev/null || echo "render: пропущен" > .ci-logs/render.log
          cp -f boat-render.log .ci-logs/ 2>/dev/null || true
          if [ -s boat.png ]; then
            cp boat.png .ci-logs/shots/shot_boat.png
          fi
          git add .ci-logs
          git commit -m "ci: рендер-артефакты прогона ${GITHUB_SHA::7} [skip ci]" || true
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "${GITHUB_REF#refs/heads/}" || true
            if git push origin HEAD:"${GITHUB_REF#refs/heads/}"; then
              break
            fi
            sleep 5
          done
