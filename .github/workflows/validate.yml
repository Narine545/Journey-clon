name: validate

# Проверки проекта Godot 4.7.2 (Linux): импорт, автотесты геймплея и рендер.
# Работа разделена на три параллельные задачи, потому что программный рендер
# (xvfb + Vulkan lavapipe) на общем раннере не успевает в один лимит времени:
#   headless — импорт и оба headless-автотеста;
#   ui       — витрина интерфейса TIDECUT (скриншоты всех экранов);
#   render   — шейдеры под настоящим Forward+ и кадры игровых сцен.
# Артефакты (логи и кадры) коммитятся в .ci-logs/ и shots/, у каждой задачи
# свои файлы, поэтому коммиты не конфликтуют.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot_bin
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot_bin
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin/godot
          chmod +x godot_bin/godot
          godot_bin/godot --version

      - name: Parse village scripts (diagnostics)
        run: |
          godot_bin/godot --headless --path . --check-only --script res://scripts/village_props.gd 2>&1 | tee parse-village-props.log || true
          godot_bin/godot --headless --path . --check-only --script res://scripts/island_village.gd 2>&1 | tee -a parse-village-props.log || true

      - name: Import project
        run: |
          godot_bin/godot --headless --path . --import > import.log 2>&1
          code=$?
          cat import.log
          if grep -qE "SCRIPT ERROR|Parse Error|Parse error|SHADER ERROR|Can't load|Failed to compile|Shader|SHADOWED_VARIABLE_BASE_CLASS|INTEGER_DIVISION" import.log; then
            echo "::error::Ошибки при импорте (см. .ci-logs в коммите CI)"
            grep -E "SCRIPT ERROR|Parse Error|Parse error|SHADER ERROR|Can't load|Failed to compile|Shader" import.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          if [ $code -ne 0 ]; then
            echo "::error::Импорт завершился с кодом $code"
            tail -10 import.log | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      # Импорт не компилирует скрипты, до которых не дотягивается ни одна
      # сцена: именно так «мёртвый» godot_fish/rod_cast.gd валил редактор
      # в recovery mode, а CI оставался зелёным. Текстовые пины ловят это
      # (и прочие регрессии) без запуска движка — они быстрые.
      - name: Python checks (текст-пины на живой код)
        run: |
          fail=0
          for f in tests/check_*.py; do
            if ! python3 "$f" > /tmp/check.log 2>&1; then
              echo "::error file=$f::проверка не прошла"
              tail -6 /tmp/check.log | while read -r line; do echo "::error::$line"; done
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            exit 1
          fi
          echo "все текстовые проверки прошли"

      - name: Smoke run (автотест геймплея)
        run: |
          JOURNEY_SMOKE=1 godot_bin/godot --headless --path . res://scenes/main.tscn --quit-after 12000 > smoke.log 2>&1
          code=$?
          cat smoke.log
          if ! grep -q "SMOKE] итог" smoke.log; then
            echo "::error::Smoke-тест не дошёл до конца (нет итоговой строки)"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Invalid (get|call|set)|Unable to" smoke.log; then
            echo "::error::Ошибки скриптов в рантайме (см. .ci-logs в коммите CI)"
            grep -E "SCRIPT ERROR|Invalid (get|call|set)|Unable to" smoke.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          if [ $code -ne 0 ]; then
            echo "::error::Smoke-тест завершился с кодом $code"
            grep "SMOKE" smoke.log | tail -30 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Boat prototype smoke test
        run: |
          JOURNEY_BOAT_SMOKE=1 godot_bin/godot --headless --path . --quit-after 500 > boat-smoke.log 2>&1
          cat boat-smoke.log
          grep -q '\[BOAT SMOKE\] итог: ВСЁ ПРОШЛО' boat-smoke.log
          if grep -qE 'SCRIPT ERROR|Parse Error|Invalid (get|call|set)|SHADOWED_VARIABLE_BASE_CLASS|INTEGER_DIVISION' boat-smoke.log; then
            exit 1
          fi

      - name: Publish logs (всегда)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p .ci-logs
          rm -f .ci-logs/import.log .ci-logs/smoke.log .ci-logs/boat-smoke.log
          cp -f import.log .ci-logs/ 2>/dev/null || echo "import: пропущен" > .ci-logs/import.log
          cp -f smoke.log .ci-logs/ 2>/dev/null || echo "smoke: пропущен" > .ci-logs/smoke.log
          cp -f boat-smoke.log .ci-logs/ 2>/dev/null || echo "boat-smoke: пропущен" > .ci-logs/boat-smoke.log
          cp -f parse-village-props.log .ci-logs/ 2>/dev/null || true
          git add .ci-logs
          git commit -q -m "ci: логи headless-прогона ${GITHUB_SHA::7} [skip ci]" || true
          OURS=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF#refs/heads/}"
            # свои файлы накладываем на верхушку ветки: параллельные задачи
            # пишут разные пути, а rebase на бинарных кадрах ломался молча
            git reset -q --hard FETCH_HEAD
            git checkout -q "$OURS" -- .ci-logs 2>/dev/null || true
            if git diff --cached --quiet && git diff --quiet; then
              break
            fi
            git commit -q -m "ci: логи headless-прогона ${GITHUB_SHA::7} [skip ci]" || true
            if git push -q origin HEAD:"${GITHUB_REF#refs/heads/}"; then
              break
            fi
            sleep 5
          done

  ui:
    runs-on: ubuntu-latest
    # Витрина TIDECUT + живой запуск + четыре полосы кадров света: под
    # софтверным Vulkan каждый кадр стоит около минуты, и на всё вместе
    # 45 минут уже не хватало — задача отменялась вместе с артефактами.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot_bin
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot_bin
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin/godot
          chmod +x godot_bin/godot
          godot_bin/godot --version

      - name: Vulkan (lavapipe) для витрины
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools > /dev/null
          vulkaninfo --summary 2>/dev/null | grep -A2 "GPU0" || echo "lavapipe: инфо недоступна"

      - name: Import project
        run: |
          godot_bin/godot --headless --path . --import > import-ui.log 2>&1
          tail -20 import-ui.log

      # Витрина интерфейса TIDECUT: все экраны снимаются отдельным скриптом
      # и кладутся в shots/ — по ним видно, как выглядит редизайн на самом деле.
      - name: TIDECUT UI screenshots (витрина интерфейса)
        run: |
          mkdir -p shots
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::error::xvfb-run недоступен — витрину интерфейса не снять"
            exit 1
          fi
          TIDE_SHOT_DIR="$PWD/shots" TIDE_SHOWCASE_QUIT=1 \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            godot_bin/godot --path . res://scenes/ui/showcase.tscn \
            --rendering-method forward_plus --resolution 1920x1080 \
            --fixed-fps 30 --quit-after 3000 > tide-ui.log 2>&1 || true
          cat tide-ui.log
          ls -la shots || true
          if grep -qiE "SCRIPT ERROR|SHADER ERROR|failed to compile|error compiling|Parse Error" tide-ui.log; then
            echo "::error::Ошибка в UI-витрине TIDECUT (см. tide-ui.log)"
            grep -iE "SCRIPT ERROR|SHADER ERROR|failed to compile|error compiling|Parse Error" tide-ui.log | head -12 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          test -f shots/tide_01_upgrade.png || (echo "::error::Скриншоты витрины не сохранились" && exit 1)
          if [ "$(ls -1 shots/*.png | wc -l)" -lt 6 ]; then
            echo "::error::Снято меньше шести экранов витрины"
            exit 1
          fi

      # Живой запуск: та же сцена, что открывает игрок (menu поверх мира).
      # Витрина проверяет экраны по отдельности, а этот шаг — реальную сборку:
      # если игра падает на старте, здесь это видно по логу и по кадру.
      - name: Boot the real game (меню поверх мира)
        run: |
          TIDE_SHOT=1 TIDE_SHOT_DIR="$PWD/shots" \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            godot_bin/godot --path . res://scenes/boat_main.tscn \
            --rendering-method forward_plus --resolution 1920x1080 \
            --quit-after 900 > boat-boot.log 2>&1 || true
          tail -60 boat-boot.log
          if grep -qiE "SCRIPT ERROR|SHADER ERROR|Parse Error|Segmentation fault|handle_crash|crash_handler|Cannot open file" boat-boot.log; then
            grep -iE "SCRIPT ERROR|SHADER ERROR|Parse Error|Segmentation fault|handle_crash|crash_handler|Cannot open file" boat-boot.log | head -12 | while read -r line; do
              echo "::error::$line"
            done
            echo "::error::Живой запуск игры падает — см. log"
            exit 1
          fi
          grep -F "[TIDE SHOT]" boat-boot.log || echo "::error::кадр живого запуска не снят"
          test -f shots/tide_07_boot.png || (echo "::error::нет shots/tide_07_boot.png" && exit 1)

      # Свет мира: одни и те же ракурсы днём, в сумерках, ночью и на рассвете.
      # ТРИ шага вместо одного: под софтверным Vulkan один кадр стоит около
      # минуты, и даже половина серии вылетала по таймауту шага CI (кадры
      # терялись вместе с задачей). Трети укладываются с запасом.
      - name: World lighting shots — посёлок и храм
        run: |
          TIDE_LIGHT_SET=village TIDE_LIGHT_SHOTS=1 TIDE_SHOT_DIR="$PWD/shots" \
            timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . res://scenes/boat_main.tscn \
            --rendering-method forward_plus --resolution 1280x720 \
            --fixed-fps 30 --quit-after 1200 > light-village.log 2>&1 || true
          tail -40 light-village.log
          if grep -qiE "SCRIPT ERROR|SHADER ERROR|Parse Error|Invalid polygon data|triangulation failed" light-village.log; then
            grep -iE "SCRIPT ERROR|SHADER ERROR|Parse Error|Invalid polygon data|triangulation failed" -A3 light-village.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          grep -F "[LIGHT SHOTS] готово" light-village.log || (echo "::error::серия «посёлок и храм» не дошла до конца" && exit 1)
          test -f shots/light_27_village_lane.png || (echo "::error::кадры улицы не снялись" && exit 1)
      - name: World lighting shots — гавань
        run: |
          TIDE_LIGHT_SET=harbor TIDE_LIGHT_SHOTS=1 TIDE_SHOT_DIR="$PWD/shots" \
            timeout 700 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . res://scenes/boat_main.tscn \
            --rendering-method forward_plus --resolution 1280x720 \
            --fixed-fps 30 --quit-after 900 > light-harbor.log 2>&1 || true
          tail -40 light-harbor.log
          if grep -qiE "SCRIPT ERROR|SHADER ERROR|Parse Error" light-harbor.log; then
            grep -iE "SCRIPT ERROR|SHADER ERROR|Parse Error" -A3 light-harbor.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          grep -F "[LIGHT SHOTS] готово" light-harbor.log || (echo "::error::серия «гавань» не дошла до конца" && exit 1)
      - name: World lighting shots — море и киты
        run: |
          TIDE_LIGHT_SET=sea TIDE_LIGHT_SHOTS=1 TIDE_SHOT_DIR="$PWD/shots" \
            timeout 1650 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . res://scenes/boat_main.tscn \
            --rendering-method forward_plus --resolution 1280x720 \
            --fixed-fps 30 --quit-after 2400 > light-shots.log 2>&1 || true
          tail -40 light-shots.log
          if grep -qiE "SCRIPT ERROR|SHADER ERROR|Parse Error" light-shots.log; then
            grep -iE "SCRIPT ERROR|SHADER ERROR|Parse Error" -A3 light-shots.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          grep -F "[LIGHT SHOTS] готово" light-shots.log || (echo "::error::серия «море и киты» не дошла до конца" && exit 1)
          test -f shots/light_10_night_beacon_wide.png || (echo "::error::кадры маяка не снялись" && exit 1)
      - name: World lighting shots — рейд (сфера, маяк, ноги)
        run: |
          TIDE_LIGHT_SET=raid TIDE_LIGHT_SHOTS=1 TIDE_SHOT_DIR="$PWD/shots" \
            timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . res://scenes/boat_main.tscn \
            --rendering-method forward_plus --resolution 1280x720 \
            --fixed-fps 30 --quit-after 1500 > light-raid.log 2>&1 || true
          tail -40 light-raid.log
          if grep -qiE "SCRIPT ERROR|SHADER ERROR|Parse Error" light-raid.log; then
            grep -iE "SCRIPT ERROR|SHADER ERROR|Parse Error" -A3 light-raid.log | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          grep -F "[LIGHT SHOTS] готово" light-raid.log || (echo "::error::серия «рейд» не дошла до конца" && exit 1)
          test -f shots/light_17_kick_03.png || (echo "::error::кадры пинка не снялись" && exit 1)
      - name: Publish UI shots (всегда)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p .ci-logs
          cp -f tide-ui.log .ci-logs/ 2>/dev/null || echo "витрина: пропущена" > .ci-logs/tide-ui.log
          cp -f boat-boot.log .ci-logs/ 2>/dev/null || true
          cp -f light-shots.log .ci-logs/light-shots.log 2>/dev/null || true
          cp -f light-harbor.log .ci-logs/light-harbor.log 2>/dev/null || true
          cp -f light-village.log .ci-logs/light-village.log 2>/dev/null || true
          cp -f light-raid.log .ci-logs/light-raid.log 2>/dev/null || true
          if compgen -G "shots/*.png" > /dev/null; then
            git add shots
          fi
          git add .ci-logs
          git commit -q -m "ci: кадры витрины TIDECUT ${GITHUB_SHA::7} [skip ci]" || true
          OURS=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF#refs/heads/}"
            git reset -q --hard FETCH_HEAD
            git checkout -q "$OURS" -- shots .ci-logs/light-shots.log .ci-logs/light-harbor.log .ci-logs/light-village.log .ci-logs/light-raid.log .ci-logs/tide-ui.log .ci-logs/boat-boot.log 2>/dev/null || true
            if git diff --cached --quiet && git diff --quiet; then
              break
            fi
            git commit -q -m "ci: кадры витрины TIDECUT ${GITHUB_SHA::7} [skip ci]" || true
            if git push -q origin HEAD:"${GITHUB_REF#refs/heads/}"; then
              break
            fi
            sleep 5
          done

  render:
    runs-on: ubuntu-latest
    # Софтверный Vulkan (lavapipe) на общем раннере: один прогон уже занимал
    # 42 минуты и проходил впритык к лимиту 45, а после появления посёлка
    # кадры сцен перестали укладываться совсем — задача отменялась на
    # последних кадрах, и артефакты приезжали неполными.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot_bin
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot_bin
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin/godot
          chmod +x godot_bin/godot
          godot_bin/godot --version

      - name: Vulkan (lavapipe) для рендер-проверки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools > /dev/null
          vulkaninfo --summary 2>/dev/null | grep -A2 "GPU0" || echo "lavapipe: инфо недоступна"

      - name: Import project
        run: |
          godot_bin/godot --headless --path . --import > import-render.log 2>&1
          tail -20 import-render.log

      # Headless (dummy-рендерер) НЕ компилирует шейдеры. Прогоняем несколько
      # кадров под xvfb + Vulkan lavapipe (софтверный) с настоящим Forward+ —
      # поймаем ошибки шейдеров и снимем кадры (проект на forward_plus).
      - name: Render check (шейдеры + скриншоты, xvfb + Vulkan lavapipe)
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::warning::xvfb-run недоступен — рендер-проверка пропущена"
            exit 0
          fi
          JOURNEY_BOAT_SHOT=1 JOURNEY_BOAT_SHOT_DRIVE=1 JOURNEY_BOAT_SHOT_TRAILER=1 JOURNEY_BOAT_SHOT_PATH="$PWD/boat.png" \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . --rendering-method forward_plus \
            --resolution 1280x720 --fixed-fps 30 --quit-after 150 \
            > boat-render.log 2>&1
          cat boat-render.log
          test -s boat.png
          if grep -iE "SHADER ERROR|failed to compile|error compiling|SCRIPT ERROR" boat-render.log; then
            exit 1
          fi
          mkdir -p .ci-logs/shots
          rm -f .ci-logs/shots/*.png # чистим кадры прошлого прогона
          SHOT_DIR="$PWD/.ci-logs/shots" JOURNEY_SHOT=1 \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . res://scenes/main.tscn --rendering-method forward_plus \
            --resolution 1280x720 --fixed-fps 30 --quit-after 700 \
            > render.log 2>&1 || true
          cat render.log
          ls -la .ci-logs/shots || true
          if grep -iE "SHADER ERROR|failed to compile|error compiling" render.log; then
            echo "::error::Ошибки компиляции шейдеров"
            exit 1
          fi
          if grep -qiE "do not support any of the supported Vulkan|Could not create.*Vulkan|Your video card" render.log; then
            echo "::error::Vulkan-контекст не поднялся (lavapipe?)"
            exit 1
          fi
          if grep -q "Vulkan" render.log; then
            echo "Vulkan-рендер поднялся, шейдеры скомпилированы"
          else
            echo "::warning::Vulkan-контекст не найден в логе — проверка могла не состояться"
          fi
          if [ ! -f .ci-logs/shots/shot_a_coast.png ]; then
            echo "::error::Скриншоты не сохранились — что-то не так с рендером"
            exit 1
          fi

      - name: Publish render artifacts (всегда)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p .ci-logs/shots
          rm -f .ci-logs/render.log .ci-logs/boat-render.log
          cp -f render.log .ci-logs/ 2>/dev/null || echo "render: пропущен" > .ci-logs/render.log
          cp -f boat-render.log .ci-logs/ 2>/dev/null || true
          if [ -s boat.png ]; then
            cp boat.png .ci-logs/shots/shot_boat.png
          fi
          git add .ci-logs
          git commit -q -m "ci: рендер-артефакты прогона ${GITHUB_SHA::7} [skip ci]" || true
          OURS=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF#refs/heads/}"
            git reset -q --hard FETCH_HEAD
            git checkout -q "$OURS" -- .ci-logs 2>/dev/null || true
            if git diff --cached --quiet && git diff --quiet; then
              break
            fi
            git commit -q -m "ci: рендер-артефакты прогона ${GITHUB_SHA::7} [skip ci]" || true
            if git push -q origin HEAD:"${GITHUB_REF#refs/heads/}"; then
              break
            fi
            sleep 5
          done

  village-audit:
    # Быстрые отдельные кадры посёлка не ждут длинного рендера моря и рейда.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot_cache
        with:
          path: godot_bin
          key: godot-4.7.2-stable-linux-x86_64
      - name: Download Godot
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot_bin
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin/godot
          chmod +x godot_bin/godot
      - name: Render village
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers > /dev/null
          godot_bin/godot --headless --path . --import > /tmp/village-import.log 2>&1
          mkdir -p shots
          TIDE_LIGHT_SET=village_audit TIDE_LIGHT_SHOTS=1 TIDE_SHOT_DIR="$PWD/shots" \
            timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot_bin/godot --path . res://scenes/boat_main.tscn \
            --rendering-method forward_plus --resolution 1280x720 \
            --fixed-fps 30 --quit-after 500 > /tmp/village-audit.log 2>&1
          cat /tmp/village-audit.log
          ! grep -qiE 'SCRIPT ERROR|SHADER ERROR|Parse Error|Invalid polygon data|triangulation failed' /tmp/village-audit.log
          grep -F '[VILLAGE AUDIT] готово' /tmp/village-audit.log
          for name in overview entry lane north_wall south_wall street trail backyards dialog timbi mimo lighthouse; do test -s "shots/village_audit_${name}.png"; done
      - name: Publish village frames
        run: |
          mkdir -p /tmp/village-frames
          cp shots/village_audit_*.png /tmp/village-frames/
          cp /tmp/village-audit.log /tmp/village-frames/village-audit.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF#refs/heads/}"
            git reset -q --hard FETCH_HEAD
            cp /tmp/village-frames/*.png shots/
            mkdir -p .ci-logs
            cp /tmp/village-frames/village-audit.log .ci-logs/village-audit.log
            git add shots/village_audit_*.png .ci-logs/village-audit.log
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "ci: посёлок ${GITHUB_SHA::7} [skip ci]"
            if git push -q origin HEAD:"${GITHUB_REF#refs/heads/}"; then exit 0; fi
            sleep 5
          done
          exit 1
