name: validate
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import
        run: |
          ./godot --headless --path . --import 2>&1 | tee import.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' import.log; then
            grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' import.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: M5 smoke test
        run: |
          set +e
          JOURNEY_SMOKE=1 timeout 300 ./godot --headless --path . 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          grep -iE 'SMOKE.*(FAIL|итог)|SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' smoke.log | head -30 | while IFS= read -r line; do echo "::notice::$line"; done || true
          if [ "$code" -ne 0 ]; then echo "::error::Smoke exited with code $code"; exit 1; fi
          grep -q '\[SMOKE\] итог: ВСЁ ПРОШЛО' smoke.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' smoke.log; then exit 1; fi
      - name: Forward+ Vulkan render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
          JOURNEY_SHOT=1 JOURNEY_LIFT_PATH="$PWD/lift.png" JOURNEY_SHOP_PATH="$PWD/shop.png" JOURNEY_CRATE_PATH="$PWD/crate.png" JOURNEY_SHOT_PATH="$PWD/tower.png" JOURNEY_LANDSCAPE_PATH="$PWD/landscape.png" JOURNEY_SCOPE_PATH="$PWD/scope.png" JOURNEY_RADIO_PATH="$PWD/radio.png" JOURNEY_ROBOT_PATH="$PWD/robot.png" JOURNEY_SKY_PATH="$PWD/sky.png" JOURNEY_RAIL_PATH="$PWD/rail.png" timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' ./godot --path . --audio-driver Dummy --rendering-method forward_plus --resolution 1280x720 2>&1 | tee render.log
          test -s tower.png
          test -s landscape.png
          test -s scope.png
          test -s radio.png
          test -s robot.png
          test -s sky.png
          test -s rail.png
          test -s shop.png
          test -s crate.png
          test -s lift.png
          grep -q 'Vulkan.*Forward+' render.log
          if grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' render.log; then
            grep -iE 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed to load|ERROR:|SHADOWED_VARIABLE_BASE_CLASS|shadowing an already-declared property in the base class|INTEGER_DIVISION|Integer division' render.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Temporary lift visual check
        run: |
          sudo apt-get install -y -qq imagemagick
          convert lift.png -resize 640x360 -quality 38 /tmp/lift.jpg
          base64 -w0 /tmp/lift.jpg | fold -w 3000 | awk '{printf "::notice::LIFT%02d_%s\n", NR, $0}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-logs
          path: |
            *.log
            tower.png
            landscape.png
            scope.png
            radio.png
            robot.png
            sky.png
            rail.png
            shop.png
            crate.png
            lift.png
