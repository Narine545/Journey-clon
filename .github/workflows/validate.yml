name: validate

# Headless-проверка проекта: импорт + автотест геймплея (JOURNEY_SMOKE).
# Раннер скачивает портативный Godot 4.7.2 stable (Linux) и прогоняет проект.
# При падении полные логи коммитятся в .ci-logs/ — их можно забрать git-ом.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: godot_bin
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mkdir -p godot_bin
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin/godot
          chmod +x godot_bin/godot
          godot_bin/godot --version

      - name: Import project
        run: |
          godot_bin/godot --headless --path . --import > import.log 2>&1
          code=$?
          cat import.log
          if grep -qE "SCRIPT ERROR|Parse Error|Parse error|SHADER ERROR|Can't load|Failed to compile|Shader" import.log; then
            echo "::error::Ошибки при импорте (см. .ci-logs в коммите CI)"
            grep -E "SCRIPT ERROR|Parse Error|Parse error|SHADER ERROR|Can't load|Failed to compile|Shader" import.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          if [ $code -ne 0 ]; then
            echo "::error::Импорт завершился с кодом $code"
            tail -10 import.log | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Smoke run (автотест геймплея)
        run: |
          JOURNEY_SMOKE=1 godot_bin/godot --headless --path . --quit-after 900 > smoke.log 2>&1
          code=$?
          cat smoke.log
          if grep -qE "SCRIPT ERROR|Invalid (get|call|set)|Unable to" smoke.log; then
            echo "::error::Ошибки скриптов в рантайме (см. .ci-logs в коммите CI)"
            grep -E "SCRIPT ERROR|Invalid (get|call|set)|Unable to" smoke.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          if [ $code -ne 0 ]; then
            echo "::error::Smoke-тест завершился с кодом $code"
            grep "SMOKE" smoke.log | tail -30 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      # Headless (dummy-рендерер) НЕ компилирует шейдеры. Прогоняем несколько
      # кадров под xvfb + Mesa llvmpipe с настоящим GL — поймаем ошибки шейдеров.
      - name: Render check (шейдеры + скриншоты, xvfb + llvmpipe)
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::warning::xvfb-run недоступен — рендер-проверка пропущена"
            exit 0
          fi
          mkdir -p .ci-logs/shots
          SHOT_DIR="$PWD/.ci-logs/shots" JOURNEY_SHOT=1 \
            xvfb-run -a -s "-screen 0 1600x900x24" \
            godot_bin/godot --path . --resolution 1600x900 --quit-after 900 \
            > render.log 2>&1 || true
          cat render.log
          ls -la .ci-logs/shots || true
          if grep -iE "SHADER ERROR|failed to compile|error compiling" render.log; then
            echo "::error::Ошибки компиляции шейдеров"
            exit 1
          fi
          if grep -q "OpenGL" render.log; then
            echo "Рендер поднялся, шейдеры скомпилированы"
          else
            echo "::warning::GL-контекст не поднялся — проверка шейдеров могла не состояться"
          fi
          if [ ! -f .ci-logs/shots/shot_c_trail.png ]; then
            echo "::error::Скриншоты не сохранились — что-то не так с рендером"
            exit 1
          fi

      - name: Publish artifacts (скриншоты всегда, логи при падении)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p .ci-logs
          cp -f import.log .ci-logs/ 2>/dev/null || true
          cp -f smoke.log .ci-logs/ 2>/dev/null || true
          cp -f render.log .ci-logs/ 2>/dev/null || true
          git add .ci-logs
          git commit -m "ci: артефакты прогона ${GITHUB_SHA::7}" || true
          git push origin HEAD:${GITHUB_REF#refs/heads/} || true
