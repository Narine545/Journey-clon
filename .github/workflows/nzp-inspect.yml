name: Temporary NZP inspection
on:
  push:
    branches: ["arena/4b8d381d-journey-clon"]
permissions:
  contents: write
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[nzp-export]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4b8d381d-journey-clon
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1 ffmpeg
          python -m pip install 'bpy==4.5.15'
      - name: Inspect source with script execution disabled
        run: |
          python - <<'PYCODE'
          import runpy, traceback, sys
          try:
              runpy.run_path('tools/export_nzp_springfield.py', run_name='__main__')
          except Exception:
              print('::error::' + traceback.format_exc().replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'), flush=True)
              sys.exit(1)
          PYCODE
      - name: Publish inspection on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add concepts/nzp_springfield/springfield_animated.glb concepts/nzp_springfield/preview_frame_01.png concepts/nzp_springfield/pose_samples.json concepts/nzp_springfield/springfield_preview.blend concepts/nzp_springfield/springfield_motion.mp4
          git commit -m 'Export standalone NZP Springfield animation trial'
          git push origin HEAD:refs/heads/arena/4b8d381d-journey-clon

  test-godot:
    if: contains(github.event.head_commit.message, '[nzp-export]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import and test the existing standalone animated GLB
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mkdir -p /tmp/nzp-check
          printf 'config_version=5\n[application]\nconfig/name="NZP GLB check"\n' > /tmp/nzp-check/project.godot
          cp concepts/nzp_springfield/springfield_animated.glb /tmp/nzp-check/
          cp tools/test_nzp_springfield.gd /tmp/nzp-check/test.gd
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/nzp-check --import >/tmp/nzp-import.log 2>&1
          set +e
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/nzp-check --script res://test.gd >/tmp/nzp-test.log 2>&1
          code=$?
          set -e
          while IFS= read -r line; do echo "::notice::$line"; done </tmp/nzp-test.log
          test "$code" -eq 0
          grep -q '\[SPRINGFIELD\] PASS' /tmp/nzp-test.log
